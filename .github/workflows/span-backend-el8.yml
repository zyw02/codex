name: Build Codex App Server for Span on EL8

on:
  push:
    branches: [span-backend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: span-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      TARGET: x86_64-unknown-linux-musl
      CODEX_MUSL_RELEASE_LINK_FLAGS: '1'
      AWS_LC_SYS_NO_JITTER_ENTROPY: '1'
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install upstream musl build tools
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Configure verified V8 archives
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl

      - name: Build the sandbox helper and main binaries
        working-directory: codex-rs
        shell: bash
        run: |
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          output="target/$TARGET/release"
          # Upstream refreshes the workspace lock at this step for release tags.
          cargo build --release --target "$TARGET" --bin bwrap
          git diff --stat -- Cargo.lock
          strip --strip-debug --strip-unneeded "$output/bwrap"
          CODEX_BWRAP_SHA256="$(sha256sum "$output/bwrap" | cut -d ' ' -f 1)"
          export CODEX_BWRAP_SHA256
          cargo build --locked --release --target "$TARGET" \
            --bin codex --bin codex-exec-server --bin codex-code-mode-host \
            --bin codex-responses-api-proxy
          strip --strip-debug "$output/codex" "$output/codex-exec-server" "$output/codex-code-mode-host"

      - name: Package the runtime using the upstream layout
        working-directory: codex-rs
        shell: bash
        run: |
          bash ../.github/scripts/build-codex-package-archive.sh \
            --target "$TARGET" --bundle primary \
            --entrypoint-dir "target/$TARGET/release" --archive-dir "$RUNNER_TEMP/span-backend"
          cd "$RUNNER_TEMP/span-backend"
          archive="codex-package-$TARGET.tar.gz"
          sha256sum "$archive" > SHA256SUMS
          mkdir unpacked
          tar -xzf "$archive" -C unpacked

      - name: Test startup and custom model catalog on EL8
        shell: bash
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/span-backend/unpacked:/backend:ro" \
            almalinux:8 bash -euo pipefail -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              codex=$(find /backend -type f -name codex -print -quit)
              test -x "$codex"
              "$codex" --version
              CODEX_HOME=$(mktemp -d)
              export CODEX_HOME
              cat > "$CODEX_HOME/config.toml" <<CONFIG
          model = "internal-model"
          model_provider = "internal_gateway"
          [model_providers.internal_gateway]
          name = "Internal gateway"
          base_url = "http://127.0.0.1:9/v1"
          wire_api = "responses"
          CONFIG
              result=$({ cat <<REQUEST
          {"id":1,"method":"initialize","params":{"clientInfo":{"name":"span-ci","version":"0.1.0"},"capabilities":{"experimentalApi":true}}}
          {"method":"initialized"}
          {"id":2,"method":"model/list","params":{"modelProvider":"internal_gateway","limit":50}}
          REQUEST
                sleep 2
              } | timeout 20s "$codex" app-server)
              /usr/libexec/platform-python -c "
          import json, sys
          replies = {}
          for line in sys.stdin:
              value = json.loads(line)
              if \"result\" in value:
                  replies[value[\"id\"]] = value[\"result\"]
          assert \"userAgent\" in replies[1], replies
          assert [row[\"model\"] for row in replies[2][\"data\"]] == [\"internal-model\"], replies
          print(\"EL8 App Server initialized and listed only the configured gateway model.\")
          " <<< "$result"
            '

      - name: Upload the verified runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: span-codex-backend-el8-x86_64
          path: |
            ${{ runner.temp }}/span-backend/codex-package-x86_64-unknown-linux-musl.tar.gz
            ${{ runner.temp }}/span-backend/SHA256SUMS
          if-no-files-found: error

  span:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the Span compatibility fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vellinlab/span
          ref: 97a4951e3724d0c05c28d143268e32ecd226964d
          persist-credentials: false

      - name: Download the backend built by this workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: span-codex-backend-el8-x86_64
          path: ${{ runner.temp }}/span-backend

      - name: Verify the combined RPM and backend on EL8
        run: |
          backend_dir="$RUNNER_TEMP/span-backend"
          (cd "$backend_dir"; sha256sum --check SHA256SUMS)
          tar -xzf "$backend_dir/codex-package-x86_64-unknown-linux-musl.tar.gz" -C "$backend_dir"
          docker run --rm --volume "$PWD:/work" --workdir /work \
            almalinux:8 bash packaging/build-el8.sh
          docker run --rm --volume "$PWD:/work:ro" --workdir /work \
            --volume "$backend_dir:/span-backend:ro" almalinux:8 bash -euo pipefail -c '
              dnf --setopt=install_weak_deps=False -y install epel-release
              dnf -y install /work/dist/span-*.rpm python39 python3-pyatspi git \
                dbus-daemon xorg-x11-server-Xvfb xdotool xclip
              backend=$(find /span-backend -type f -name codex -print -quit)
              test -x "$backend"
              dbus-run-session -- bash packaging/test-real-app-server.sh /usr/bin/span "$backend"
            '
