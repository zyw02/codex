name: Build Clue for EL8

on:
  push:
    branches: [span-backend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: span-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET: x86_64-unknown-linux-musl
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CODEX_MUSL_RELEASE_LINK_FLAGS: '1'
      AWS_LC_SYS_NO_JITTER_ENTROPY: '1'
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate the upstream archive tools before compiling
        run: |
          preflight="$(mktemp -d "$RUNNER_TEMP/packaging.XXXXXX")"
          mkdir "$preflight/bin"
          for bin in codex codex-exec-server codex-code-mode-host bwrap; do
            install -m 0755 /usr/bin/true "$preflight/bin/$bin"
          done
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends zstd
          fi
          RUNNER_TEMP="$preflight" bash .github/scripts/build-codex-package-archive.sh \
            --target "$TARGET" --bundle clue \
            --entrypoint-dir "$preflight/bin" --archive-dir "$preflight/archives"
          tar -tzf "$preflight/archives/clue-package-$TARGET.tar.gz" >/dev/null

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install upstream musl build tools
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Configure verified V8 archives
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl

      - name: Build the sandbox helper and main binaries
        id: compile
        working-directory: codex-rs
        shell: bash
        run: |
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          output="target/$TARGET/release"
          # Upstream refreshes the workspace lock at this step for release tags.
          cargo build --release --target "$TARGET" --bin bwrap
          git diff --stat -- Cargo.lock
          strip --strip-debug --strip-unneeded "$output/bwrap"
          CODEX_BWRAP_SHA256="$(sha256sum "$output/bwrap" | cut -d ' ' -f 1)"
          export CODEX_BWRAP_SHA256
          cargo build --locked --release --target "$TARGET" \
            --bin codex --bin codex-exec-server --bin codex-code-mode-host \
            --bin codex-responses-api-proxy
          strip --strip-debug "$output/codex" "$output/codex-exec-server" "$output/codex-code-mode-host"

      - name: Package the runtime using the upstream layout
        working-directory: codex-rs
        shell: bash
        run: |
          bash ../.github/scripts/build-codex-package-archive.sh \
            --target "$TARGET" --bundle clue \
            --entrypoint-dir "target/$TARGET/release" --archive-dir "$RUNNER_TEMP/span-backend"
          cd "$RUNNER_TEMP/span-backend"
          archive="clue-package-$TARGET.tar.gz"
          sha256sum "$archive" > SHA256SUMS
          mkdir unpacked
          tar -xzf "$archive" -C unpacked

      - name: Test startup and custom model catalog on EL8
        shell: bash
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/span-backend/unpacked:/backend:ro" \
            almalinux:8 bash -euo pipefail -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              clue=/backend/bin/clue
              test -x "$clue"
              "$clue" --version | grep -E "^clue [0-9]"
              test -s /backend/LICENSE && test -s /backend/NOTICE && test -s /backend/CLUE.md
              fixture=$(mktemp -d)
              export CLUE_HOME="$fixture/clue" CODEX_HOME="$fixture/codex-unused" TMPDIR="$fixture/tmp"
              mkdir "$CLUE_HOME" "$TMPDIR"
              cat > "$CLUE_HOME/config.toml" <<CONFIG
          model = "internal-model"
          model_provider = "internal_gateway"
          [model_providers.internal_gateway]
          name = "Internal gateway"
          base_url = "http://127.0.0.1:9/v1"
          wire_api = "responses"
          CONFIG
              timeout 25s /usr/libexec/platform-python - "$clue" <<PY
          import json
          from pathlib import Path
          import subprocess
          import sys

          with subprocess.Popen([sys.argv[1], "app-server"], stdin=subprocess.PIPE,
                                stdout=subprocess.PIPE, universal_newlines=True) as server:
              assert Path("/proc/{}/comm".format(server.pid)).read_text().strip() == "clue"
              def send(payload):
                  server.stdin.write(json.dumps(payload) + "\\n")
                  server.stdin.flush()

              def result(request_id):
                  for line in server.stdout:
                      message = json.loads(line)
                      if message.get("id") == request_id:
                          assert "result" in message, message
                          return message["result"]
                  raise RuntimeError("App Server stopped before replying")

              send({"id": 1, "method": "initialize", "params": {
                  "clientInfo": {"name": "span-ci", "version": "0.1.0"},
                  "capabilities": {"experimentalApi": True}}})
              assert "userAgent" in result(1)
              send({"method": "initialized"})
              send({"id": 2, "method": "model/list", "params": {
                  "modelProvider": "internal_gateway", "limit": 50}})
              models = [row["model"] for row in result(2)["data"]]
              assert models == ["internal-model"], models
              server.stdin.close()
              assert server.wait(timeout=5) == 0
          print("EL8 App Server initialized and listed only the configured gateway model.")
          PY
            '

      - name: Upload the verified runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clue-el8-x86_64
          path: |
            ${{ runner.temp }}/span-backend/clue-package-x86_64-unknown-linux-musl.tar.gz
            ${{ runner.temp }}/span-backend/SHA256SUMS
          if-no-files-found: error

      - name: Preserve compiled inputs if packaging or verification fails
        if: failure() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: span-codex-backend-unverified-build-inputs
          path: |
            codex-rs/target/x86_64-unknown-linux-musl/release/codex
            codex-rs/target/x86_64-unknown-linux-musl/release/codex-code-mode-host
            codex-rs/target/x86_64-unknown-linux-musl/release/codex-exec-server
            codex-rs/target/x86_64-unknown-linux-musl/release/bwrap
          retention-days: 3
          if-no-files-found: error

